<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bellamorfosis</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <style>
        /* Enhanced promo modal styling */
        .promo-modal {
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .promo-modal.show {
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Responsive buttons */
        .btn {
            width: 100%;
            max-width: 200px;
            padding: 15px;
            margin: 10px;
            font-size: 16px;
            display: inline-block;
            text-align: center;
            border: none;
            border-radius: 5px;
            background-color: blue;
            color: white;
            transition: transform 0.3s;
        }
        .btn:hover {
            transform: scale(1.05);
        }

        /* Floating WhatsApp button */
        .whatsapp-button {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background-color: #25D366;
            border-radius: 50%;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Expandable logo */
        .logo {
            cursor: pointer;
            transition: transform 0.3s;
        }
        .logo:active {
            transform: scale(1.2);
        }

        /* Confetti animation background */
        .confetti {
            position: absolute;
            pointer-events: none;
            animation: fall 1s infinite;
        }
        @keyframes fall {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* Footer styling */
        footer {
            text-align: center;
            padding: 20px;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
    <header>
        <img src="logo.png" alt="Logo" class="logo" />
    </header>

    <main>
        <div class="promo-modal">Promo Content Here</div>
        <button class="btn">Click Here</button>
        <div class="whatsapp-button">WhatsApp</div>
    </main>

    <footer>
        <p>Made by <a href="https://yourportfolio.com">Your Name</a></p>
    </footer>
</body>
</html>
